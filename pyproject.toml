[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-routes-engine"
version = "0.1.0"
description = "Provider-neutral ingestion and route exploration for commercial flights"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "tzdata==2026.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.17,<1", "build>=1.3,<2", "timezonefinder==8.2.4"]
producer = ["timezonefinder==8.2.4"]

[project.scripts]
flyji = "admin.client:main"
flyji-ingest = "ingestion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ingestion", "src/server", "src/admin"]

[tool.hatch.build]
dev-mode-dirs = ["src", "vendor/bobowatch"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/bobowatch/bobowatch/__init__.py" = "bobowatch/__init__.py"
"vendor/bobowatch/bobowatch/adapter.py" = "bobowatch/adapter.py"
"vendor/bobowatch/bobowatch/protocol.py" = "bobowatch/protocol.py"
"vendor/bobowatch/bobowatch/asgi.py" = "bobowatch/asgi.py"
"vendor/bobowatch/bobowatch/client.py" = "bobowatch/client.py"
"vendor/bobowatch/bobowatch/config.py" = "bobowatch/config.py"
"vendor/bobowatch/bobowatch/paths.py" = "bobowatch/paths.py"
"vendor/bobowatch/bobowatch/provision.py" = "bobowatch/provision.py"
