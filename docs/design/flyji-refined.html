 const obstacles=[...svg.querySelectorAll('.fr-route.selected,.fr-route.shared,.fr-route.compared')].flatMap(p=>{const length=p.getTotalLength();return d3.range(0,length,10).map(t=>{const point=p.getPointAtLength(t);return [point.x,point.y];});});const labels=airportLabels(Object.keys(places).filter(code=>edges.some(e=>e.from===code||e.to===code)&&visible(places[code].coord)).map(code=>({code,xy:projection(places[code].coord)})).filter(p=>p.xy[0]>=-5&&p.xy[0]<=width+5&&p.xy[1]>=-5&&p.xy[1]<=height+5),width,height,obstacles);
 svg.querySelector('.fr-leaders').innerHTML=labels.map(p=>`<path class="fr-leader" d="M${p.xy[0]},${p.xy[1]}L${Math.max(p.lx,Math.min(p.lx+p.w,p.xy[0]))},${Math.max(p.ly,Math.min(p.ly+p.h,p.xy[1]))}"></path>`).join('');app.querySelector('.fr-airports').innerHTML=labels.map(p=>`<button type="button" class="fr-airport cursor-interaction" data-airport="${p.code}" style="left:${p.lx}px;top:${p.ly}px" aria-pressed="${state.airport===p.code}" aria-label="Inspect ${places[p.code].full}, ${p.code}">${p.code}</button>`).join('');for(const b of app.querySelectorAll('[data-airport]'))b.onclick=()=>{state.airport=b.dataset.airport;state.edge=null;renderAll();persist(direction);};

function renderMapInspect(model){const node=model.app.querySelector('.fr-map-inspect'),items=pool();if(state.airport){const p=places[state.airport];node.innerHTML=`<strong>${p.name} · ${state.airport}</strong><p>${p.full} · ${p.zone}</p><p>At cursor: ${local(state.hour,state.airport)}</p>${!['YYZ','CDG'].includes(state.airport)?`<button type="button" class="fr-avoid-airport cursor-interaction">Avoid this connection</button>`:''}`;const avoid=node.querySelector('.fr-avoid-airport');if(avoid)avoid.onclick=()=>{changeQuery('avoid',state.airport,model.direction);model.app.querySelector('.fr-undo').focus({preventScroll:true});};return;}if(state.edge){const [from,to]=state.edge.split('|'),matches=items.filter(o=>o.legs.some(l=>l.from===from&&l.to===to));node.innerHTML=`<strong>${from} → ${to} · ${matches.length} matching dated ${matches.length===1?'journey':'journeys'}</strong><p>Choose the complete dated journey behind this physical line.</p><div class="fr-inspect-choices">${matches.map(o=>`<button type="button" class="cursor-interaction" data-edge-select="${o.id}" aria-pressed="${state.selected===o.id}">${label(o)} · ${local(o.out,'YYZ')} · ${duration(o.hours)}</button>`).join('')}</div>${matches.length?'':'<p>Retained selected or compared route · outside current filters.</p>'}`;for(const b of node.querySelectorAll('button'))b.onclick=()=>select(b.dataset.edgeSelect,model.direction);return;}const selected=get(state.selected),compared=get(state.compared),shared=selected&&compared&&selected.legs.some(l=>compared.legs.some(c=>l.from===c.from&&l.to===c.to));node.innerHTML='<p>'+(shared?'Selected and compared journeys share geographic legs. Their markers show different scheduled moments.':'Route lines show geography; dated choices show the complete journey.')+'</p>';}
function pickEdge(model,point){const paths=[...model.app.querySelectorAll('.fr-route')].filter(p=>getComputedStyle(p).display!=='none');let nearest=null,distance=Infinity;for(const path of paths){const length=path.getTotalLength();for(let t=0;t<=length;t+=Math.max(1,length/160)){const at=path.getPointAtLength(t),d=Math.hypot(at.x-point[0],at.y-point[1]);if(d<distance){distance=d;nearest=path.dataset.edge;}}}if(distance>14||!nearest)return;state.edge=nearest;state.airport=null;renderAll();persist(model.direction);}
let stageTask=0;
function equalizeStages(){if(stageTask)cancelAnimationFrame(stageTask);stageTask=requestAnimationFrame(()=>{stageTask=0;const width=root.clientWidth;if(!width)return;const measure=document.createElement('div');measure.style.cssText=`position:absolute;left:0;top:0;width:${width}px;visibility:hidden;pointer-events:none`;measure.setAttribute('aria-hidden','true');measure.inert=true;root.append(measure);let max=0;for(const model of models){const clone=model.app.cloneNode(true);clone.style.minHeight='0';measure.append(clone);max=Math.max(max,clone.offsetHeight);clone.remove();}measure.remove();root.style.setProperty('--fr-stage-height',Math.ceil(max)+'px');});}
function renderAll(){preserveFocus(()=>{for(const model of models){renderControls(model);renderChoices(model);renderDetail(model);renderTime(model);drawMap(model);}equalizeStages();});}
renderAll();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
let resizeTask=0;const resize=new ResizeObserver(()=>{cancelAnimationFrame(resizeTask);resizeTask=requestAnimationFrame(()=>{preserveFocus(()=>{for(const m of models){renderTime(m);drawMap(m);}equalizeStages();});});});resize.observe(root);for(const m of models){resize.observe(m.app.querySelector('.fr-map-stage'));resize.observe(m.app.querySelector('.fr-time-chart'));}
window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.refreshVersion!==1)return;Object.assign(state,p.query||{});for(const m of models){Object.assign(m.camera,p.cameras?.[m.direction]||{});if(p.mobileViews?.[m.direction])m.app.dataset.mobileView=p.mobileViews[m.direction];for(const button of m.app.querySelectorAll('[data-mobile-view]'))button.setAttribute('aria-pressed',String(button.dataset.mobileView===m.app.dataset.mobileView));}renderAll();});
