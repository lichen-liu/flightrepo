[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flight-routes-engine"
version = "0.1.0"
description = "Provider-neutral ingestion and route exploration for commercial flights"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
flyji = "admin.client:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ingestion", "src/server", "src/admin"]

