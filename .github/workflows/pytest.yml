name: Python tests

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run pytest
        run: python -m pytest -q

      - name: Check Python style
        run: |
          ruff check src tests scripts installation deployment
          ruff format --check src tests scripts installation deployment

      - name: Verify the installed package
        run: |
          python -m build --wheel --outdir var/wheels
          python scripts/verify_package.py var/wheels/*.whl

  browser:
    name: Browser workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run frontend unit tests
        run: node --test tests/test_frontend.mjs
      - name: Install browser QA tools
        run: |
          npm install --prefix var/browser-qa --no-save playwright@1.62.1
          var/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser checks against the demo
        env:
          NODE_PATH: var/browser-qa/node_modules
          FLYJI_QA_BROWSER: chromium
        run: |
          mkdir -p var
          python scripts/run_demo.py --port 8013 > var/demo-server.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8013/health/ready; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8013/health/ready; then
            cat var/demo-server.log
            exit 1
          fi
          node scripts/qa_web.cjs
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: var/web-qa/
          if-no-files-found: ignore
